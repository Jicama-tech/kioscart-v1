<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KiosCart - Online Platform for Kiosk and Cart Management. Manage your e-shop, products, and orders seamlessly." />
  <meta name="theme-color" content="#6366f1" />
  <meta name="google-site-verification" content="ChVUXKMS9XjJBu8m8rY9J2RTEtTkYanDAsC7QjciuSc" />

  <title>KiosCart - Online Platform for Kiosk and Cart Management</title>
  <meta name="author" content="Jicama.Tech" />

  <!-- OG Meta Tags (Nginx sub_filter replaces these per custom domain) -->
  <meta property="og:title" content="KiosCart - E-Shop Management" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kioscart.com/" />
  <meta property="og:description" content="Online Platform for Kiosk and Cart Management" />
  <meta property="og:image" content="https://kioscart.com/KiosCart.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="KiosCart" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="KiosCart - E-Shop Management" />
  <meta name="twitter:description" content="Online Platform for Kiosk and Cart Management" />
  <meta name="twitter:image" content="https://kioscart.com/KiosCart.png" />

  <link rel="icon" href="/KiosCart.png" type="image/png" />

  <!-- Preconnect to external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://www.instagram.com" />
  <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
  <link rel="dns-prefetch" href="https://img.youtube.com" />
  <link rel="dns-prefetch" href="https://player.vimeo.com" />

  <!-- Preload the critical font to avoid render-blocking -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  </noscript>
</head>

<body>
  <div id="root">
    <!-- Instant loading skeleton — shows in <100ms before any JS loads -->
    <div id="app-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafafa;font-family:system-ui,-apple-system,sans-serif">
      <img src="/KiosCart.png" alt="" width="56" height="56" style="margin-bottom:16px;border-radius:12px" />
      <div style="width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
  </div>

  <!-- Prefetch storefront data while JS downloads -->
  <script>
    (function(){
      var path = window.location.pathname.replace(/^\//,'');
      if(path && !['login','signup','admin','shopkeeper','agent','pricing','blog','faq','contact-us','about-us','terms','privacy-policy'].some(function(r){return path.startsWith(r)})){
        var slug = path.split('/')[0];
        if(slug){
          var url = (window.__API_URL__ || 'https://api.kioscart.com') + '/shopkeeper-stores/storefront-bundle/' + slug + '?t=' + Date.now();
          window.__PREFETCHED_STORE__ = fetch(url,{method:'GET',cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return null});
        }
      }
    })();
  </script>
  <noscript>
    <div style="font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px;">
      <h1>KiosCart - Online Platform for Kiosk and Cart Management</h1>
      <p>KiosCart helps shopkeepers manage their online store, products, orders, and payments seamlessly. Create your e-shop, manage inventory, accept payments, and grow your business.</p>
      <h2>Features</h2>
      <ul>
        <li>Product Management with variants and options</li>
        <li>Online Storefront for customers</li>
        <li>Kiosk Mode for in-store sales</li>
        <li>Order and Payment tracking</li>
        <li>CRM and Customer Management</li>
        <li>Analytics and Reporting</li>
      </ul>
      <p><a href="/privacy-policy">Privacy Policy</a> | <a href="/terms">Terms and Conditions</a> | <a href="/contact-us">Contact Us</a></p>
      <p>&copy; 2026 KiosCart by Jicama.Tech. All rights reserved.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
